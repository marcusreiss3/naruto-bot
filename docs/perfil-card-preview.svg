<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Protótipo de card dinâmico do perfil ninja</title>
  <desc id="desc">Card de perfil para Discord com área de arte, identidade, recursos e atributos do personagem.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#11151d"/>
      <stop offset=".55" stop-color="#192130"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#743330"/>
      <stop offset=".55" stop-color="#241d2b"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="hp" x1="0" x2="1"><stop stop-color="#dd5960"/><stop offset="1" stop-color="#ff8a75"/></linearGradient>
    <linearGradient id="chakra" x1="0" x2="1"><stop stop-color="#529bd4"/><stop offset="1" stop-color="#92d5ff"/></linearGradient>
    <linearGradient id="energia" x1="0" x2="1"><stop stop-color="#d4a452"/><stop offset="1" stop-color="#f5d68a"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".4"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <style>
      .label { font: 700 18px Arial, sans-serif; letter-spacing: 2px; fill: #9ca8b9; }
      .value { font: 700 24px Arial, sans-serif; fill: #f4f0e8; }
      .small { font: 500 18px Arial, sans-serif; fill: #b8c0cc; }
      .number { font: 800 34px Arial, sans-serif; fill: #f8f4ec; }
      .attr { font: 700 18px Arial, sans-serif; fill: #c9d0da; letter-spacing: 1px; }
      .attrv { font: 800 32px Arial, sans-serif; fill: #f6f0e6; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <path d="M0 718C272 600 433 763 685 682S1118 495 1600 655V900H0Z" fill="#d95656" fill-opacity=".06"/>
  <path d="M1130 0L1600 0 1600 430C1460 342 1302 234 1130 0Z" fill="#d95656" fill-opacity=".09"/>

  <g filter="url(#shadow)">
    <rect x="56" y="56" width="1488" height="788" rx="30" fill="#111720" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <rect x="56" y="56" width="18" height="788" rx="9" fill="#d85a5a"/>
  </g>

  <!-- Área reservada à arte/thumbnail dinâmica do personagem. -->
  <clipPath id="portraitClip"><rect x="76" y="76" width="470" height="748" rx="20"/></clipPath>
  <g clip-path="url(#portraitClip)">
    <rect x="76" y="76" width="470" height="748" fill="url(#art)"/>
    <circle cx="295" cy="350" r="234" fill="#e0635a" fill-opacity=".12"/>
    <circle cx="295" cy="350" r="166" fill="none" stroke="#f8d9bd" stroke-opacity=".17" stroke-width="3"/>
    <path d="M289 205c-67 0-119 55-119 122 0 44 17 74 37 100l-27 195h222l-28-195c21-26 37-56 37-100 0-67-54-122-122-122Z" fill="#080b11" fill-opacity=".64"/>
    <path d="M185 630c33-82 70-127 110-127 41 0 78 45 112 127" fill="#d85a5a" fill-opacity=".22"/>
    <path d="M111 705 485 266M88 761 516 353" stroke="#f8d9bd" stroke-opacity=".08" stroke-width="22"/>
    <text x="295" y="718" text-anchor="middle" class="label" fill="#f5eee2">ARTE DO PERSONAGEM</text>
    <text x="295" y="748" text-anchor="middle" class="small" fill="#e1c1b1">imagem dinâmica ou avatar</text>
  </g>
  <rect x="76" y="76" width="470" height="748" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="2"/>

  <!-- Cabeçalho / identidade -->
  <text x="604" y="132" class="label" fill="#dc6b66">PERFIL SHINOBI</text>
  <text x="604" y="194" style="font: 800 54px Arial, sans-serif; fill:#f8f2e8">Kaori Uchiha</text>
  <text x="604" y="229" class="small">@tcmthiago  •  Konohagakure</text>
  <rect x="1262" y="107" width="220" height="84" rx="18" fill="#d85a5a" fill-opacity=".16" stroke="#dc6b66" stroke-opacity=".5"/>
  <text x="1372" y="139" text-anchor="middle" class="label" fill="#f1b5aa">NÍVEL</text>
  <text x="1372" y="177" text-anchor="middle" class="number">12</text>
  <line x1="604" y1="266" x2="1482" y2="266" stroke="#ffffff" stroke-opacity=".12"/>

  <g transform="translate(604 296)">
    <rect width="422" height="88" rx="16" fill="#ffffff" fill-opacity=".045"/>
    <text x="22" y="30" class="label">CLÃ</text><text x="22" y="66" class="value">Uchiha</text>
    <rect x="446" width="432" height="88" rx="16" fill="#ffffff" fill-opacity=".045"/>
    <text x="468" y="30" class="label">RANK</text><text x="468" y="66" class="value">Chūnin</text>
  </g>
  <g transform="translate(604 404)">
    <rect width="878" height="90" rx="16" fill="#d85a5a" fill-opacity=".09" stroke="#d85a5a" stroke-opacity=".28"/>
    <text x="22" y="30" class="label" fill="#ef9c94">TRAIT</text>
    <text x="22" y="68" class="value">Prodígio Ninja</text>
    <text x="838" y="59" text-anchor="end" class="small">Lendária</text>
  </g>

  <!-- Recursos -->
  <text x="604" y="550" class="label">RECURSOS</text>
  <g transform="translate(604 576)">
    <text x="0" y="0" class="attr">VIDA</text><text x="372" y="0" text-anchor="end" class="small">80 / 100</text>
    <rect x="0" y="16" width="372" height="14" rx="7" fill="#ffffff" fill-opacity=".11"/><rect x="0" y="16" width="298" height="14" rx="7" fill="url(#hp)"/>
    <text x="0" y="65" class="attr">CHAKRA</text><text x="372" y="65" text-anchor="end" class="small">62 / 100</text>
    <rect x="0" y="81" width="372" height="14" rx="7" fill="#ffffff" fill-opacity=".11"/><rect x="0" y="81" width="231" height="14" rx="7" fill="url(#chakra)"/>
    <text x="0" y="130" class="attr">ENERGIA</text><text x="372" y="130" text-anchor="end" class="small">90 / 100</text>
    <rect x="0" y="146" width="372" height="14" rx="7" fill="#ffffff" fill-opacity=".11"/><rect x="0" y="146" width="335" height="14" rx="7" fill="url(#energia)"/>
  </g>

  <!-- Build breve -->
  <g transform="translate(1032 544)">
    <text x="0" y="6" class="label">ELEMENTOS</text>
    <text x="0" y="46" class="value">Fogo  •  Raio</text>
    <text x="0" y="91" class="label">ESTILO DE LUTA</text>
    <text x="0" y="131" class="value">Ninjutsu</text>
  </g>

  <!-- Resumo de atributos, sem substituir /atributos. -->
  <line x1="604" y1="760" x2="1482" y2="760" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="604" y="798" class="label">RESUMO DE ATRIBUTOS</text>
  <g transform="translate(864 782)">
    <text x="0" y="0" class="attr">NIN</text><text x="0" y="38" class="attrv">14</text>
    <text x="110" y="0" class="attr">TAI</text><text x="110" y="38" class="attrv">09</text>
    <text x="220" y="0" class="attr">GEN</text><text x="220" y="38" class="attrv">11</text>
    <text x="330" y="0" class="attr">BUKI</text><text x="330" y="38" class="attrv">07</text>
    <text x="455" y="0" class="attr">FUIN</text><text x="455" y="38" class="attrv">08</text>
    <text x="580" y="0" class="attr">DEF</text><text x="580" y="38" class="attrv">10</text>
  </g>
</svg>
